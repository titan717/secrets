# One-click: https://render.com/deploy?repo=https://github.com/titan717/ai.secrets
services:
  - type: web
    name: secrets-ai
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile=false && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        value: "*"
      - key: SECRETS_API_URL
        sync: false
