<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="description" content="Secrets — Your world. Your people. Your space. Private messaging, Docks and calls." />
    <link rel="icon" type="image/png" href="/brand/logo-mark.png" />
    <link rel="apple-touch-icon" href="/brand/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Secrets — Your world. Your people. Your space.</title>
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("secrets.settings") || "{}").state || {};
          var t = s.theme || "system";
          if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
    <style>
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center; background: #0b0b12;
        transition: opacity .35s ease; z-index: 9999;
      }
      #boot img { width: 92px; height: 92px; filter: drop-shadow(0 0 32px rgba(168,85,247,.55)); animation: bootfloat 2.4s ease-in-out infinite; }
      @keyframes bootfloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true"><img src="/brand/mascot.png" alt="" /></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
